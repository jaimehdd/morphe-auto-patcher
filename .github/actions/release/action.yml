name: Releasing APK files
inputs:
  github_token:
    description: "GitHub Token"
    required: true
runs:
  using: "composite"
  steps:
    - name: Check for files to release
      shell: bash
      run: |
        if ls ./release/*.apk >/dev/null 2>&1; then
          echo "has_files=true" >> $GITHUB_ENV
        else
          echo "has_files=false" >> $GITHUB_ENV
        fi

    - name: Generate release info
      if: env.has_files == 'true'
      shell: bash
      run: |
        changelog_file="${{ github.workspace }}-CHANGELOG.txt"
        {
          echo "### 📦 Build Details"
          echo "* **App**: \`${APP_NAME:-unknown}\`"
          echo "* **Variant**: \`${VARIANT:-unknown}\`"
          echo "* **Target Version**: \`${APP_VERSION:-unknown}\`"
          echo "* **Patch Version**: \`${patch_version:-unknown}\`"
          echo ""
          echo "### 🔗 Upstream Changelogs & Sources :point_down:"
          case "${VARIANT}" in
            morphe)
              echo "* **Morphe Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              echo "* **Morphe Desktop / Patcher**: [MorpheApp/morphe-desktop](https://github.com/MorpheApp/morphe-desktop/releases)"
              ;;
            adobo)
              echo "* **Adobo Patches**: [jkennethcarino/adobo](https://github.com/jkennethcarino/adobo/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            hushfacebook)
              echo "* **HushFacebook Patches**: [SysAdminDoc/HushFacebook](https://github.com/SysAdminDoc/HushFacebook/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            hushgram)
              echo "* **HushGram Patches**: [SysAdminDoc/HushGram](https://github.com/SysAdminDoc/HushGram/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            hushmessenger)
              echo "* **HushMessenger Patches**: [SysAdminDoc/HushMessenger](https://github.com/SysAdminDoc/HushMessenger/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            akash-sriram)
              echo "* **Akash Sriram Google Photos Patches**: [Akash-Sriram/morphe-google-photos](https://github.com/Akash-Sriram/morphe-google-photos/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            rushi)
              echo "* **Rushi Patches**: [rushiranpise/morphe-patches](https://github.com/rushiranpise/morphe-patches/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            hoo-dles)
              echo "* **hoo-dles Patches**: [hoo-dles/morphe-patches](https://github.com/hoo-dles/morphe-patches/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            binarymend)
              echo "* **Binarymend Patches**: [binarymend/morphe-patches](https://github.com/binarymend/morphe-patches/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            dh6k)
              echo "* **dh6k Patches**: [dh6k/morphe-patches](https://github.com/dh6k/morphe-patches/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            hooman)
              echo "* **Hooman Patches**: [arandomhooman/hoomans-morphe-patches](https://github.com/arandomhooman/hoomans-morphe-patches/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            hushfeed)
              echo "* **Hushfeed TikTok Patches**: [SysAdminDoc/hushfeed](https://github.com/SysAdminDoc/hushfeed/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            hxreborn)
              echo "* **hxreborn Patches**: [hxreborn/morphe-patches](https://github.com/hxreborn/morphe-patches/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            *)
              echo "* **Morphe Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
          esac
          echo ""
          echo "---"
          echo "<details>"
          echo "<summary><b>All Active Patch Repositories</b></summary>"
          echo ""
          echo "| Provider | Repository | Focus / Target Apps |"
          echo "| :--- | :--- | :--- |"
          echo "| **Morphe** | [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases) | YouTube, YouTube Music, Reddit, Base Engine |"
          echo "| **Adobo** | [jkennethcarino/adobo](https://github.com/jkennethcarino/adobo/releases) | Reddit |"
          echo "| **HushFacebook** | [SysAdminDoc/HushFacebook](https://github.com/SysAdminDoc/HushFacebook/releases) | Facebook |"
          echo "| **HushGram** | [SysAdminDoc/HushGram](https://github.com/SysAdminDoc/HushGram/releases) | Instagram |"
          echo "| **HushMessenger** | [SysAdminDoc/HushMessenger](https://github.com/SysAdminDoc/HushMessenger/releases) | Messenger |"
          echo "| **Akash Sriram** | [Akash-Sriram/morphe-google-photos](https://github.com/Akash-Sriram/morphe-google-photos/releases) | Google Photos |"
          echo "| **Binarymend** | [binarymend/morphe-patches](https://github.com/binarymend/morphe-patches/releases) | Moon+ Reader |"
          echo "| **dh6k** | [dh6k/morphe-patches](https://github.com/dh6k/morphe-patches/releases) | Brave Browser |"
          echo "| **hoo-dles** | [hoo-dles/morphe-patches](https://github.com/hoo-dles/morphe-patches/releases) | FotMob |"
          echo "| **Hooman** | [arandomhooman/hoomans-morphe-patches](https://github.com/arandomhooman/hoomans-morphe-patches/releases) | Poweramp |"
          echo "| **Hushfeed** | [SysAdminDoc/hushfeed](https://github.com/SysAdminDoc/hushfeed/releases) | TikTok |"
          echo "| **hxreborn** | [hxreborn/morphe-patches](https://github.com/hxreborn/morphe-patches/releases) | ReadEra |"
          echo "| **Rushi** | [rushiranpise/morphe-patches](https://github.com/rushiranpise/morphe-patches/releases) | AdGuard, Windy, Komoot, Strava |"
          echo "| **Morphe Desktop** | [MorpheApp/morphe-desktop](https://github.com/MorpheApp/morphe-desktop/releases) | CLI & Patcher Engine |"
          echo ""
          echo "</details>"
        } > "${changelog_file}"

    - name: Release
      if: env.has_files == 'true'
      uses: ncipollo/release-action@v1.21.0
      with:
        artifacts: |
          ./release/*.apk
        name: ${{ env.APP_NAME }}-${{ env.VARIANT }}-${{ env.APP_VERSION }}-${{ env.patch_version }}
        token: ${{ inputs.github_token }}
        tag: ${{ env.APP_NAME }}-${{ env.VARIANT }}-${{ env.APP_VERSION }}-${{ env.patch_version }}
        bodyFile: ${{ github.workspace }}-CHANGELOG.txt
        allowUpdates: true

    - name: Cleanup old releases
      if: env.has_files == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        APP_PREFIX="${APP_NAME}-${VARIANT}-"
        KEEP_COUNT=2

        echo "Cleaning up old releases for: $APP_PREFIX (keeping $KEEP_COUNT)"

        # Get all releases matching this app prefix, sorted by semantic version desc
        releases=$(gh release list --repo ${{ github.repository }} --limit 100 --json tagName,name \
          | jq -r --arg prefix "$APP_PREFIX" '.[] | select(.name | startswith($prefix)) | .tagName' \
          | sed 's/-dev/~dev/g' \
          | sort -V -r \
          | sed 's/~dev/-dev/g')

        # Count and delete old releases
        count=0
        for tag in $releases; do
          count=$((count + 1))
          if [ $count -gt $KEEP_COUNT ]; then
            echo "Deleting old release: $tag"
            gh release delete "$tag" --repo ${{ github.repository }} --yes --cleanup-tag || true
          fi
        done

        echo "Cleanup complete. Kept $KEEP_COUNT most recent releases for $APP_PREFIX"
