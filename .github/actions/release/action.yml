name: Releasing APK files
inputs:
  github_token:
    description: "GitHub Token"
    required: true
runs:
  using: "composite"
  steps:
    - name: Check for files to release
      shell: bash
      run: |
        if ls ./release/*.apk >/dev/null 2>&1; then
          echo "has_files=true" >> $GITHUB_ENV
        else
          echo "has_files=false" >> $GITHUB_ENV
        fi

    - name: Generate release info
      if: env.has_files == 'true'
      shell: bash
      run: |
        tag_prefix="${APP_NAME}"
        if [[ "${VARIANT}" =~ ^hush ]]; then
          tag_prefix="${APP_NAME}-hush"
        fi
        release_tag="${tag_prefix}-${APP_VERSION}-${patch_version}"
        if [[ "${OMIT_PATCH_VERSION:-false}" == "true" ]]; then
          release_tag="${tag_prefix}-${APP_VERSION}"
        fi
        echo "RELEASE_TAG=${release_tag}" >> $GITHUB_ENV
        echo "APP_NAME_FILTER=${tag_prefix}" >> $GITHUB_ENV

        changelog_file="${{ github.workspace }}-CHANGELOG.txt"
        {
          echo "### 📦 Build Details"
          echo "* **App**: \`${APP_NAME:-unknown}\`"
          echo "* **Variant**: \`${VARIANT:-unknown}\`"
          echo "* **Target Version**: \`${APP_VERSION:-unknown}\`"
          echo "* **Patch Version**: \`${patch_version:-unknown}\`"
          echo ""
          echo "### 🔗 Upstream Changelogs & Sources :point_down:"
          if [ -f "src/targets.json" ]; then
            sources_md=$(jq -r --arg app "${APP_NAME:-}" --arg var "${VARIANT:-}" '
              first(.targets[] | select(.app_name == $app and .variant == $var)) as $t
              | if $t then
                  ($t.sources | map("* **\(.name)**: [\(.repo)](https://github.com/\(.repo)/releases)")),
                  (if ($t.custom_builder // "") == "niagram" then
                    ["* **Resource Patching**: [REAndroid/APKEditor](https://github.com/REAndroid/APKEditor/releases) (Telegram Premium Star launcher + notification icons)"]
                  elif ($t.org == "Morphe") then
                    ["* **Morphe Desktop / Patcher**: [MorpheApp/morphe-desktop](https://github.com/MorpheApp/morphe-desktop/releases)"]
                  elif (($t.sources | map(.repo) | index("MorpheApp/morphe-patches")) == null) then
                    ["* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"]
                  else [] end)
                else
                  ["* **Morphe Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"]
                end
              | .[]
            ' src/targets.json)
            echo "$sources_md"
          else
            echo "* **Morphe Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
          fi
          echo ""
          echo "---"
          echo "<details>"
          echo "<summary><b>All Active Patch Repositories</b></summary>"
          echo ""
          echo "| Provider | Repository | Focus / Target Apps |"
          echo "| :--- | :--- | :--- |"
          if [ -f "src/targets.json" ]; then
            jq -r '
              [.targets[] as $t | $t.sources[] | {name: .name, repo: .repo, app: $t.app_name}]
              | group_by(.repo)
              | map({
                  name: .[0].name,
                  repo: .[0].repo,
                  apps: (map(.app) | unique | join(", "))
                })
              | .[]
              | "| **\(.name)** | [\(.repo)](https://github.com/\(.repo)/releases) | \(.apps) |"
            ' src/targets.json
            echo "| **Morphe Desktop** | [MorpheApp/morphe-desktop](https://github.com/MorpheApp/morphe-desktop/releases) | CLI & Patcher Engine |"
          fi
          echo ""
          echo "</details>"
        } > "${changelog_file}"

    - name: Release
      if: env.has_files == 'true'
      uses: ncipollo/release-action@v1.21.0
      with:
        artifacts: |
          ./release/*.apk
        name: ${{ env.RELEASE_TAG }}
        token: ${{ inputs.github_token }}
        tag: ${{ env.RELEASE_TAG }}
        bodyFile: ${{ github.workspace }}-CHANGELOG.txt
        allowUpdates: true

    - name: Cleanup old releases
      if: env.has_files == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        APP_FILTER="${APP_NAME_FILTER:-$APP_NAME}"
        KEEP_COUNT=1

        echo "Cleaning up old releases for: $APP_FILTER (keeping $KEEP_COUNT)"

        # Get all releases matching this app, sorted by semantic version desc
        # Ensure we match "^${APP_FILTER}-[0-9]" so youtube does not match youtube-music
        releases=$(gh release list --repo ${{ github.repository }} --limit 100 --json tagName,name \
          | jq -r --arg app "$APP_FILTER" '.[] | select(.tagName | test("^" + $app + "-[0-9]")) | .tagName' \
          | sed 's/-dev/~dev/g' \
          | sort -V -r \
          | sed 's/~dev/-dev/g')

        # Count and delete old releases
        count=0
        for tag in $releases; do
          count=$((count + 1))
          if [ $count -gt $KEEP_COUNT ]; then
            echo "Deleting old release: $tag"
            gh release delete "$tag" --repo ${{ github.repository }} --yes --cleanup-tag || true
          fi
        done

        echo "Cleanup complete. Kept $KEEP_COUNT most recent release for $APP_FILTER"
