name: Releasing APK files
inputs:
  github_token:
    description: "GitHub Token"
    required: true
runs:
  using: "composite"
  steps:
    - name: Check for files to release
      shell: bash
      run: |
        if ls ./release/*.apk >/dev/null 2>&1; then
          echo "has_files=true" >> $GITHUB_ENV
        else
          echo "has_files=false" >> $GITHUB_ENV
        fi

    - name: Generate release info
      if: env.has_files == 'true'
      shell: bash
      run: |
        tag_prefix="${APP_NAME}"
        if [[ "${VARIANT}" =~ ^hush ]]; then
          tag_prefix="${APP_NAME}-hush"
        fi
        release_tag="${tag_prefix}-${APP_VERSION}-${patch_version}"
        echo "RELEASE_TAG=${release_tag}" >> $GITHUB_ENV
        echo "APP_NAME_FILTER=${tag_prefix}" >> $GITHUB_ENV

        changelog_file="${{ github.workspace }}-CHANGELOG.txt"
        {
          echo "### 📦 Build Details"
          echo "* **App**: \`${APP_NAME:-unknown}\`"
          echo "* **Variant**: \`${VARIANT:-unknown}\`"
          echo "* **Target Version**: \`${APP_VERSION:-unknown}\`"
          echo "* **Patch Version**: \`${patch_version:-unknown}\`"
          echo ""
          echo "### 🔗 Upstream Changelogs & Sources :point_down:"
          case "${VARIANT}" in
            morphe)
              echo "* **Morphe Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              echo "* **Morphe Desktop / Patcher**: [MorpheApp/morphe-desktop](https://github.com/MorpheApp/morphe-desktop/releases)"
              ;;
            adobo)
              echo "* **Adobo Patches**: [jkennethcarino/adobo](https://github.com/jkennethcarino/adobo/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            hushfacebook)
              echo "* **HushFacebook Patches**: [SysAdminDoc/HushFacebook](https://github.com/SysAdminDoc/HushFacebook/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            hushgram)
              echo "* **HushGram Patches**: [SysAdminDoc/HushGram](https://github.com/SysAdminDoc/HushGram/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            hushmessenger)
              echo "* **HushMessenger Patches**: [SysAdminDoc/HushMessenger](https://github.com/SysAdminDoc/HushMessenger/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            akash-sriram)
              echo "* **Akash Sriram Google Photos Patches**: [Akash-Sriram/morphe-google-photos](https://github.com/Akash-Sriram/morphe-google-photos/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            rushi)
              echo "* **Rushi Patches**: [rushiranpise/morphe-patches](https://github.com/rushiranpise/morphe-patches/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            heval)
              echo "* **Heval Patches**: [heval99/Heval-Morphe-Patches](https://github.com/heval99/Heval-Morphe-Patches/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            binarymend)
              echo "* **Binarymend Patches**: [binarymend/morphe-patches](https://github.com/binarymend/morphe-patches/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            dh6k)
              echo "* **dh6k Patches**: [dh6k/morphe-patches](https://github.com/dh6k/morphe-patches/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            mwbra130)
              echo "* **Mwbra130 Patches**: [mwbra130/Retro-Bowl-College](https://github.com/mwbra130/Retro-Bowl-College/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            hushfeed)
              echo "* **Hushfeed TikTok Patches**: [SysAdminDoc/hushfeed](https://github.com/SysAdminDoc/hushfeed/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            michii)
              echo "* **Michii Patches**: [heyymichii/michii-patches](https://github.com/heyymichii/michii-patches/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            badfella)
              echo "* **BadFella Patches**: [XBadFellaX/BadFella-Patches](https://github.com/XBadFellaX/BadFella-Patches/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            amfakh)
              echo "* **Amfakh Patches**: [amfakh/fakh-patches](https://github.com/amfakh/fakh-patches/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            riky)
              echo "* **Riky Patches**: [riky-dev/morphe-patches](https://github.com/riky-dev/morphe-patches/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            patcheddit)
              echo "* **Patcheddit Patches**: [wchill/patcheddit](https://github.com/wchill/patcheddit/releases)"
              echo "* **Morphe Base Engine & Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
            shini-cell)
              echo "* **Shini Morphe Patches**: [shini-cell/shini-morphe](https://github.com/shini-cell/shini-morphe/releases)"
              echo "* **NagramXF Upstream**: [Keeperorowner/NagramXF](https://github.com/Keeperorowner/NagramXF/releases)"
              ;;
            *)
              echo "* **Morphe Patches**: [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases)"
              ;;
          esac
          echo ""
          echo "---"
          echo "<details>"
          echo "<summary><b>All Active Patch Repositories</b></summary>"
          echo ""
          echo "| Provider | Repository | Focus / Target Apps |"
          echo "| :--- | :--- | :--- |"
          echo "| **Morphe** | [MorpheApp/morphe-patches](https://github.com/MorpheApp/morphe-patches/releases) | YouTube, YouTube Music, Reddit, Base Engine |"
          echo "| **Adobo** | [jkennethcarino/adobo](https://github.com/jkennethcarino/adobo/releases) | Reddit |"
          echo "| **HushFacebook** | [SysAdminDoc/HushFacebook](https://github.com/SysAdminDoc/HushFacebook/releases) | Facebook |"
          echo "| **HushGram** | [SysAdminDoc/HushGram](https://github.com/SysAdminDoc/HushGram/releases) | Instagram |"
          echo "| **HushMessenger** | [SysAdminDoc/HushMessenger](https://github.com/SysAdminDoc/HushMessenger/releases) | Messenger |"
          echo "| **Akash Sriram** | [Akash-Sriram/morphe-google-photos](https://github.com/Akash-Sriram/morphe-google-photos/releases) | Google Photos |"
          echo "| **Binarymend** | [binarymend/morphe-patches](https://github.com/binarymend/morphe-patches/releases) | Moon+ Reader |"
          echo "| **dh6k** | [dh6k/morphe-patches](https://github.com/dh6k/morphe-patches/releases) | Brave Browser |"
          echo "| **Heval** | [heval99/Heval-Morphe-Patches](https://github.com/heval99/Heval-Morphe-Patches/releases) | FotMob |"
          echo "| **Mwbra130** | [mwbra130/Retro-Bowl-College](https://github.com/mwbra130/Retro-Bowl-College/releases) | Poweramp |"
          echo "| **Hushfeed** | [SysAdminDoc/hushfeed](https://github.com/SysAdminDoc/hushfeed/releases) | TikTok |"
          echo "| **Michii** | [heyymichii/michii-patches](https://github.com/heyymichii/michii-patches/releases) | LinkedIn (Archive) |"
          echo "| **BadFella** | [XBadFellaX/BadFella-Patches](https://github.com/XBadFellaX/BadFella-Patches/releases) | LinkedIn |"
          echo "| **Rushi** | [rushiranpise/morphe-patches](https://github.com/rushiranpise/morphe-patches/releases) | AdGuard |"
          echo "| **Amfakh** | [amfakh/fakh-patches](https://github.com/amfakh/fakh-patches/releases) | Windy |"
          echo "| **Riky** | [riky-dev/morphe-patches](https://github.com/riky-dev/morphe-patches/releases) | Komoot |"
          echo "| **Patcheddit** | [wchill/patcheddit](https://github.com/wchill/patcheddit/releases) | Reddit Sync |"
          echo "| **Shini** | [shini-cell/shini-morphe](https://github.com/shini-cell/shini-morphe/releases) | Nagram XF |"
          echo "| **Morphe Desktop** | [MorpheApp/morphe-desktop](https://github.com/MorpheApp/morphe-desktop/releases) | CLI & Patcher Engine |"
          echo ""
          echo "</details>"
        } > "${changelog_file}"

    - name: Release
      if: env.has_files == 'true'
      uses: ncipollo/release-action@v1.21.0
      with:
        artifacts: |
          ./release/*.apk
        name: ${{ env.RELEASE_TAG }}
        token: ${{ inputs.github_token }}
        tag: ${{ env.RELEASE_TAG }}
        bodyFile: ${{ github.workspace }}-CHANGELOG.txt
        allowUpdates: true

    - name: Cleanup old releases
      if: env.has_files == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        APP_FILTER="${APP_NAME_FILTER:-$APP_NAME}"
        KEEP_COUNT=1

        echo "Cleaning up old releases for: $APP_FILTER (keeping $KEEP_COUNT)"

        # Get all releases matching this app, sorted by semantic version desc
        # Ensure we match "^${APP_FILTER}-[0-9]" so youtube does not match youtube-music, and reddit does not match reddit-sync
        releases=$(gh release list --repo ${{ github.repository }} --limit 100 --json tagName,name \
          | jq -r --arg app "$APP_FILTER" '.[] | select(.tagName | test("^" + $app + "-[0-9]")) | .tagName' \
          | sed 's/-dev/~dev/g' \
          | sort -V -r \
          | sed 's/~dev/-dev/g')

        # Count and delete old releases
        count=0
        for tag in $releases; do
          count=$((count + 1))
          if [ $count -gt $KEEP_COUNT ]; then
            echo "Deleting old release: $tag"
            gh release delete "$tag" --repo ${{ github.repository }} --yes --cleanup-tag || true
          fi
        done

        echo "Cleanup complete. Kept $KEEP_COUNT most recent release for $APP_FILTER"
