name: Manual Patch
permissions: write-all
env:
  repository: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  org_input: ${{ inputs.org }}
  org_event_input: ${{ github.event.inputs.org }}
  force_patch: ${{ inputs.force_patch || false }}
on:
  workflow_dispatch:
    inputs:
      org:
        description: 'Which patch bundle do you want to build?'
        required: true
        default: "Morphe"
        type: choice
        options:
          - "Morphe-Community"
          - "Morphe"
      app:
        description: 'Specific app to patch (e.g. "instagram", "messenger", "photos") or "all"'
        required: false
        default: "all"
        type: string
      use_beta:
        description: "Use beta versions"
        required: false
        default: false
        type: boolean
      force_patch:
        description: "Force patch even if release already has APK assets"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      org:
        required: true
        type: string
      targets:
        description: "JSON array of apps to patch (e.g. '[\"instagram\"]')"
        required: false
        type: string
        default: ""
      use_beta:
        description: "Use beta versions"
        required: false
        type: boolean
        default: false
      force_patch:
        description: "Force patch even if release already has APK assets"
        required: false
        type: boolean
        default: false
jobs:
  resolve-targets:
    name: Resolve Target Apps
    runs-on: ubuntu-latest
    outputs:
      morphe_targets: ${{ steps.set-targets.outputs.morphe_targets }}
      community_targets: ${{ steps.set-targets.outputs.community_targets }}
    steps:
      - id: set-targets
        run: |
          call_targets='${{ inputs.targets }}'
          dispatch_app='${{ github.event.inputs.app }}'

          if [ -n "$call_targets" ] && [ "$call_targets" != "[]" ] && [ "$call_targets" != '""' ]; then
            echo "community_targets=$call_targets" >> $GITHUB_OUTPUT
            echo 'morphe_targets=["youtube","reddit","youtube-music"]' >> $GITHUB_OUTPUT
          elif [ -n "$dispatch_app" ] && [ "$dispatch_app" != "all" ]; then
            echo "community_targets=[\"$dispatch_app\"]" >> $GITHUB_OUTPUT
            echo "morphe_targets=[\"$dispatch_app\"]" >> $GITHUB_OUTPUT
          else
            echo 'community_targets=["photos","instagram","messenger","strava","fotmob","windy","moonreader","adguard","komoot","brave","poweramp","tiktok","reddit-adobo","facebook","readera","linkedin","telegram","nagramxf"]' >> $GITHUB_OUTPUT
            echo 'morphe_targets=["youtube","reddit","youtube-music"]' >> $GITHUB_OUTPUT
          fi

  patch_morphe:
    name: Patch Morphe (${{ matrix.run }})
    needs: resolve-targets
    if: ${{ github.event.inputs.org == 'Morphe' || inputs.org == 'Morphe' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.resolve-targets.outputs.morphe_targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Preparing to patch
        uses: ./.github/actions/preparing
      - name: Check github connection
        id: check-gh-morphe
        run: bash src/etc/connection.sh
      - name: Check stable experimental support versions
        id: experimental-check
        if: steps.check-gh-morphe.outputs.internet_error == '0'
        uses: ./.github/actions/experimental-check
        with:
          release_channel: stable
      - name: Patch apk
        id: patch-morphe
        if: steps.check-gh-morphe.outputs.internet_error == '0'
        env:
          use_beta: ${{ inputs.use_beta }}
          youtube_experimental_support: ${{ steps.experimental-check.outputs.youtube_experimental_support }}
          youtube_music_experimental_support: ${{ steps.experimental-check.outputs.youtube_music_experimental_support }}
          reddit_experimental_support: ${{ steps.experimental-check.outputs.reddit_experimental_support }}
        run: bash src/build/morphe.sh ${{ matrix.run }}
      - name: Releasing APK files
        id: release-morphe
        if: steps.check-gh-morphe.outputs.internet_error == '0'
        uses: ./.github/actions/release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  patch_community:
    name: Patch Morphe Community (${{ matrix.run }})
    needs: resolve-targets
    if: ${{ github.event.inputs.org == 'Morphe-Community' || inputs.org == 'Morphe-Community' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.resolve-targets.outputs.community_targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Preparing to patch
        uses: ./.github/actions/preparing
      - name: Check github connection
        id: check-gh-derv
        run: bash src/etc/connection.sh
      - name: Patch apk
        id: patch-derv
        if: steps.check-gh-derv.outputs.internet_error == '0'
        env:
          use_beta: ${{ inputs.use_beta }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: bash src/build/morphe-community.sh ${{ matrix.run }}
      - name: Releasing APK files
        id: release-derv
        if: steps.check-gh-derv.outputs.internet_error == '0'
        uses: ./.github/actions/release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
