name: Check new patch
permissions: write-all
on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "37 9,21 * * *"
  workflow_dispatch:
    inputs:
      retry_count:
        description: 'Do not change value below'
        required: false
        default: '1'
jobs:
  check:
    name: Check new patch
    runs-on: ubuntu-latest
    env:
      repository: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Check github connection
        id: check-gh
        run: bash src/etc/connection.sh
      - name: Check all patch sources (parallel)
        id: check-all
        if: steps.check-gh.outputs.internet_error == '0'
        run: python3 src/etc/ci_check.py --manifest src/targets.json --precheck-mpp --stamp-skipped
      - name: Re-run workflow if github connection not stable
        if: always() && steps.check-all.outcome == 'skipped'
        uses: actions/github-script@v9
        with:
          script: |
            const maxRetries = 3;
            let retryCount = Number('${{ inputs.retry_count || 1 }}');
            if (retryCount < maxRetries) {
              retryCount += 1;
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "ci.yml",
                ref: context.ref,
                inputs: {
                  'retry_count': String(retryCount)
                }
              });
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      check_morphe: ${{ steps.check-all.outputs.check_morphe }}
      morphe_targets: ${{ steps.check-all.outputs.morphe_targets }}
      check_morphe_community: ${{ steps.check-all.outputs.check_morphe_community }}
      community_targets: ${{ steps.check-all.outputs.community_targets }}
      morphe_desktop_tag: ${{ steps.check-all.outputs.morphe_desktop_tag }}
      youtube_experimental_support: ${{ steps.check-all.outputs.youtube_experimental_support }}
      youtube_music_experimental_support: ${{ steps.check-all.outputs.youtube_music_experimental_support }}
      reddit_experimental_support: ${{ steps.check-all.outputs.reddit_experimental_support }}

  Patch-Morphe:
    name: Patch Morphe
    needs: check
    if: ${{ needs.check.outputs.check_morphe == '1' }}
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      org: "Morphe"
      targets: ${{ needs.check.outputs.morphe_targets }}
      morphe_desktop_tag: ${{ needs.check.outputs.morphe_desktop_tag }}
      youtube_experimental_support: ${{ needs.check.outputs.youtube_experimental_support }}
      youtube_music_experimental_support: ${{ needs.check.outputs.youtube_music_experimental_support }}
      reddit_experimental_support: ${{ needs.check.outputs.reddit_experimental_support }}
  Patch-Morphe-Community:
    name: Patch Morphe Community
    needs: check
    if: ${{ needs.check.outputs.check_morphe_community == '1' }}
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      org: "Morphe-Community"
      targets: ${{ needs.check.outputs.community_targets }}
      morphe_desktop_tag: ${{ needs.check.outputs.morphe_desktop_tag }}
