name: Check new patch
permissions: write-all
on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 10,22 * * *"
  workflow_dispatch:
    inputs:
      retry_count:
        description: 'Do not change value below'
        required: false
        default: '1'
jobs:
  check:
    name: Check new patch
    runs-on: ubuntu-latest
    env:
      repository: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Check github connection
        id: check-gh
        run: bash src/etc/connection.sh
      - name: Check new patch Morphe
        id: check-morphe
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh MorpheApp/morphe-patches latest "youtube:^youtube-arm64-v8a-morphe\.apk$" "youtube-music:^youtube-music-arm64-v8a-morphe\.apk$" "reddit-adobo:reddit.*adobo.*apk"
      - name: Check new patch HushGram
        id: check-hushgram
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh SysAdminDoc/HushGram latest instagram.*hushgram.*apk
      - name: Check new patch Binarymend
        id: check-binarymend
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh binarymend/morphe-patches latest moonreader.*binarymend.*apk
      - name: Check new patch heval
        id: check-heval
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh heval99/Heval-Morphe-Patches latest "fotmob.*heval.*apk"
      - name: Check new patch hooman
        id: check-hooman
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh arandomhooman/hoomans-morphe-patches latest "poweramp.*hooman.*apk"
      - name: Check new patch Rushi
        id: check-rushi
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh rushiranpise/morphe-patches latest "adguard:adguard.*rushi.*apk" "komoot:komoot.*rushi.*apk" "windy:windy.*rushi.*apk"
      - name: Check new patch Akash-Sriram
        id: check-akash-sriram
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh Akash-Sriram/morphe-google-photos latest "(google-photos|gg-photos).*akash-sriram.*apk"
      - name: Check new patch dh6k
        id: check-dh6k
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh dh6k/morphe-patches latest brave.*dh6k.*apk
      - name: Check new patch Hushfeed
        id: check-hushfeed
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh SysAdminDoc/hushfeed latest tiktok.*hushfeed.*apk
      - name: Check new patch Adobo
        id: check-adobo
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh jkennethcarino/adobo all "reddit-adobo:reddit.*adobo.*apk"
      - name: Check new patch HushFacebook
        id: check-hushfacebook
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh SysAdminDoc/HushFacebook latest facebook.*hushfacebook.*apk
      - name: Check new patch HushMessenger
        id: check-hushmessenger
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh SysAdminDoc/HushMessenger latest messenger.*hushmessenger.*apk
      - name: Check new patch hxreborn
        id: check-hxreborn
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh hxreborn/morphe-patches latest readera.*hxreborn.*apk
      - name: Check new patch michii
        id: check-michii
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh heyymichii/michii-patches latest linkedin.*michii.*apk
      - name: Check new patch shini-cell
        id: check-shini-cell
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh shini-cell/shini-morphe latest nagramxf.*shini-cell.*apk
      - name: Combine check outputs
        id: combine-community
        if: steps.check-gh.outputs.internet_error == '0'
        run: |
          targets=()
          [ "${{ steps.check-hushgram.outputs.new_patch }}" = "1" ] && targets+=("instagram")
          [ "${{ steps.check-hushfacebook.outputs.new_patch }}" = "1" ] && targets+=("facebook")
          [ "${{ steps.check-hushmessenger.outputs.new_patch }}" = "1" ] && targets+=("messenger")
          [ "${{ steps.check-shini-cell.outputs.new_patch }}" = "1" ] && targets+=("nagramxf")
          [ "${{ steps.check-hushfeed.outputs.new_patch }}" = "1" ] && targets+=("tiktok")
          [ "${{ steps.check-akash-sriram.outputs.new_patch }}" = "1" ] && targets+=("photos")
          [ "${{ steps.check-binarymend.outputs.new_patch }}" = "1" ] && targets+=("moonreader")
          [ "${{ steps.check-hxreborn.outputs.new_patch }}" = "1" ] && targets+=("readera")
          [ "${{ steps.check-michii.outputs.new_patch }}" = "1" ] && targets+=("linkedin")
          [ "${{ steps.check-heval.outputs.new_patch }}" = "1" ] && targets+=("fotmob")
          [ "${{ steps.check-hooman.outputs.new_patch }}" = "1" ] && targets+=("poweramp")
          [ "${{ steps.check-dh6k.outputs.new_patch }}" = "1" ] && targets+=("brave")
          [ "${{ steps.check-adobo.outputs.new_patch }}" = "1" ] && targets+=("reddit-adobo")
          if [ "${{ steps.check-rushi.outputs.new_patch }}" = "1" ]; then
            read -ra rushi_targets <<< "${{ steps.check-rushi.outputs.targets }}"
            if [ ${#rushi_targets[@]} -gt 0 ]; then
              targets+=("${rushi_targets[@]}")
            else
              targets+=("adguard" "komoot" "windy")
            fi
          fi

          m_targets_clean=()
          morphe_has_new=0
          if [ "${{ steps.check-morphe.outputs.new_patch }}" = "1" ]; then
            read -ra m_targets <<< "${{ steps.check-morphe.outputs.targets }}"
            if [ ${#m_targets[@]} -gt 0 ]; then
              for t in "${m_targets[@]}"; do
                if [ "$t" = "reddit-adobo" ]; then
                  targets+=("reddit-adobo")
                else
                  m_targets_clean+=("$t")
                fi
              done
              if [ ${#m_targets_clean[@]} -gt 0 ]; then
                morphe_json=$(jq -c -n '$ARGS.positional' --args "${m_targets_clean[@]}")
                morphe_has_new=1
              else
                morphe_json='[]'
                morphe_has_new=0
              fi
            else
              morphe_json='["youtube","youtube-music"]'
              morphe_has_new=1
            fi
            echo "morphe_targets=$morphe_json" >> $GITHUB_OUTPUT
            echo "check_morphe=$morphe_has_new" >> $GITHUB_OUTPUT
          else
            echo "morphe_targets=[]" >> $GITHUB_OUTPUT
            echo "check_morphe=0" >> $GITHUB_OUTPUT
          fi

          if [ ${#targets[@]} -gt 0 ]; then
            unique_targets=($(printf "%s\n" "${targets[@]}" | sort -u))
            json=$(jq -c -n '$ARGS.positional' --args "${unique_targets[@]}")
            echo "targets=$json" >> $GITHUB_OUTPUT
            echo "new_patch=1" >> $GITHUB_OUTPUT
            echo "Target apps to build: $json"
          else
            echo "targets=[]" >> $GITHUB_OUTPUT
            echo "new_patch=0" >> $GITHUB_OUTPUT
            echo "No new patches detected."
          fi
      - name: Re-run workflow if github connection not stable
        if: always() && steps.check-morphe.outcome == 'skipped'
        uses: actions/github-script@v9
        with:
          script: |
            const maxRetries = 3;
            let retryCount = Number('${{ inputs.retry_count || 1 }}');
            if (retryCount < maxRetries) {
              retryCount += 1;
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "ci.yml",
                ref: context.ref,
                inputs: {
                  'retry_count': String(retryCount)
                }
              });
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      check_morphe: ${{ steps.combine-community.outputs.check_morphe }}
      morphe_targets: ${{ steps.combine-community.outputs.morphe_targets }}
      check_morphe_community: ${{ steps.combine-community.outputs.new_patch }}
      community_targets: ${{ steps.combine-community.outputs.targets }}

  Patch-Morphe:
    name: Patch Morphe
    needs: check
    if: ${{ needs.check.outputs.check_morphe == 1 }}
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      org: "Morphe"
      targets: ${{ needs.check.outputs.morphe_targets }}
  Patch-Morphe-Community:
    name: Patch Morphe Community
    needs: check
    if: ${{ needs.check.outputs.check_morphe_community == 1 }}
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      org: "Morphe-Community"
      targets: ${{ needs.check.outputs.community_targets }}